# Netlify config (used only if you deploy to Netlify instead of Vercel)
[build]
  command = "npm run build"
  publish = "dist"

# Booking page — serve the standalone /book/index.html for the bare /book path
# (must come before the SPA fallback below).
[[redirects]]
  from = "/book"
  to = "/book/index.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
